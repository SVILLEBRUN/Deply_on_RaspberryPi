# Docker Compose pour un environnement de développement

networks:
    my-apps-network:
        driver: bridge


services:
    nginx:
        image: nginx:latest
        container_name: nginx
        ports:
            - "80:80"
        restart: always
        volumes:
            - ./nginx_dev.conf:/etc/nginx/conf.d/default.conf
        networks:
            - my-apps-network

    sv-portfolio:
        container_name: sv-portfolio
        build:
            context: ../sv-portfolio
            dockerfile: dev.Dockerfile
        ports:
            - "8081:8081"
            - "24678:24678"
        restart: always
        volumes:
            - ../sv-portfolio:/app
            - /app/node_modules
            - /app/.nuxt
        networks:
            - my-apps-network
        environment:
            - HOST=0.0.0.0
            - PORT=8081
            - WATCHPACK_POLLING=true
      
    proxy:
        container_name: proxy
        build:
            context: ../proxy
            target: 'development-stage'
        ports:
            # - "5000:5000"  # Port locked on MacOS, we use 5001 instead
            - "5001:5001"
        restart: always
        volumes:
            - ../proxy:/app
        networks:
            - my-apps-network
        env_file:
            - .env

    movie-db-vue:
        container_name: movie-db-vue
        build:
            context: ../Movie_db_app/movie-db-vue
            target: 'development-stage'
        ports:
            - "8080:8080" # En développement, on expose le port 8080 mais pas en production
        restart: always
        volumes:
            - ../Movie_db_app/movie-db-vue:/app
        command: /bin/sh -c "npm install && quasar dev"
        networks:
            - my-apps-network

    movie-db-core-api:
        container_name: movie-db-core-api
        build:
            context: ../Movie_db_app/movie-db-core-api
            target: 'development-stage'
        ports:
            - "3000:3000"
        restart: always
        volumes:
            - ../Movie_db_app/movie-db-core-api:/app
        environment:
            - DATABASE_URL=${DATABASE_URL_MDB}
        networks:
            - my-apps-network
        env_file:
            - .env
    
    airjewels-db:
        image: postgres:latest
        container_name: airjewels-db
        restart: always
        volumes:
            - airjewels-dev-db-data:/var/lib/postgresql
        ports:
            - "5432:5432"
        networks:
            - my-apps-network
        env_file:
            - .env
        environment:
            - POSTGRES_USER=${POSTGRES_USER_AIRJEWELS}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD_AIRJEWELS}

    airjewels-rails:
        container_name: airjewels-rails
        build:
            context: ../airjewels-rails
            dockerfile: dev.Dockerfile
        command: bundle exec rails s -b '0.0.0.0' -p 3001
        ports:
            - "3001:3001"
        depends_on:
            - airjewels-db
        restart: always
        volumes:
            - ../airjewels-rails:/rails    # Only for development
            - airjewels-dev-app-storage:/rails/storage
            - airjewels-dev-bundle_cache:/usr/local/bundle
            - airjewels-dev-node_modules_cache:/rails/node_modules
        networks:
            - my-apps-network
        env_file:
            - .env

    academint-db:
        image: postgres:latest
        container_name: academint-db
        restart: always
        volumes:
            - academint-dev-db-data:/var/lib/postgresql
        ports:
            - "5433:5433"
        networks:
            - my-apps-network
        env_file:
            - .env
        environment:
            - POSTGRES_USER=${POSTGRES_USER_ACADEMINT}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD_ACADEMINT}

    academint:
        container_name: academint
        build:
            context: ../Academint
            dockerfile: dev.Dockerfile
        command: bundle exec rails s -b '0.0.0.0' -p 3002
        ports:
            - "3002:3002"
        depends_on:
            - academint-db
        restart: always
        volumes:
            - ../academint:/rails    # Only for development
            - academint-dev-app-storage:/rails/storage
            - academint-dev-bundle_cache:/usr/local/bundle
            - academint-dev-node_modules_cache:/rails/node_modules
        networks:
            - my-apps-network
        env_file:
            - .env


    tv-time-db:
        image: postgres:18
        container_name: tv-time-db
        restart: always
        volumes:
            - tv-time-dev-db-data:/var/lib/postgresql
        ports:
            - "5434:5432"
        networks:
            - my-apps-network
        environment:
            - POSTGRES_USER=${POSTGRES_USER_TV_TIME}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD_TV_TIME}
            - POSTGRES_DB=${POSTGRES_DB_TV_TIME}
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 3s
            timeout: 3s
            retries: 20

    tv-time-backend:
        container_name: tv-time-backend
        build:
            context: ../tv-time/backend
            target: 'development-stage'
        command: sh -c "pnpm install && pnpm prisma generate && pnpm prisma migrate deploy && pnpm dev"
        ports:
            - "3003:3001"
        depends_on:
            tv-time-db:
                condition: service_healthy
        restart: always
        volumes:
            - ../tv-time/backend:/app    # Only for development
            - tv-time-dev-backend-node_modules:/app/node_modules
        networks:
            - my-apps-network
        environment:
            - NODE_ENV=development
            - LOG_LEVEL=debug
            - DATABASE_URL=postgresql://${POSTGRES_USER_TV_TIME}:${POSTGRES_PASSWORD_TV_TIME}@tv-time-db:5432/${POSTGRES_DB_TV_TIME}?schema=public
            - JWT_SECRET=${JWT_SECRET_TV_TIME}
            - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID_TV_TIME}
            - TMDB_API_KEY=${TMDB_API_KEY}
            - TV_TIME_FRONT_URL=http://localhost
            # Public URL of the app, base path included: used for the links in emails
            - PUBLIC_APP_URL=http://localhost/tv-time
            # Password reset emails (Nodemailer, SMTP): sent for real, even in development
            - SMTP_HOST=${SMTP_HOST_TV_TIME}
            - SMTP_PORT=${SMTP_PORT_TV_TIME}
            - SMTP_USER=${SMTP_USER_TV_TIME}
            - SMTP_PASS=${SMTP_PASS_TV_TIME}
            - MAIL_FROM=${MAIL_FROM_TV_TIME}

    tv-time-frontend:
        container_name: tv-time-frontend
        build:
            context: ../tv-time/frontend-nuxt
            target: 'development-stage'
        command: sh -c "pnpm install && pnpm dev --host 0.0.0.0"
        ports:
            - "3004:3000"
        depends_on:
            - tv-time-backend
        restart: always
        volumes:
            - ../tv-time/frontend-nuxt:/app    # Only for development
            - tv-time-dev-frontend-node_modules:/app/node_modules
        networks:
            - my-apps-network
        environment:
            - NUXT_APP_BASE_URL=/tv-time/
            - API_BASE=http://tv-time-backend:3001/tv-time/api
            - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID_TV_TIME}


volumes:
    airjewels-dev-db-data:
        name: airjewels-dev-db-data
    airjewels-dev-app-storage: 
        name: airjewels-dev-app-storage
    airjewels-dev-bundle_cache:
        name: airjewels-dev-bundle_cache
    airjewels-dev-node_modules_cache:
        name: airjewels-dev-node_modules_cache
    academint-dev-db-data:
        name: academint-dev-db-data
    academint-dev-app-storage: 
        name: academint-dev-app-storage
    academint-dev-bundle_cache:
        name: academint-dev-bundle_cache
    academint-dev-node_modules_cache:
        name: academint-dev-node_modules_cache
    tv-time-dev-db-data:
        name: tv-time-dev-db-data
    tv-time-dev-backend-node_modules:
        name: tv-time-dev-backend-node_modules
    tv-time-dev-frontend-node_modules:
        name: tv-time-dev-frontend-node_modules
