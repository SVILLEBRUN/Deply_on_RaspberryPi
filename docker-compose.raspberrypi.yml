# Docker compose pour déployer en production sur le raspberry pi depuis les images généré par GitHub Actions et stocké sur Docker Hub
# Copier cette config dans un fichier docker-compose.yml à la racide du projet multi-app-netwok
# NOTE : platform: linux/arm64 => Optimisé pour les machines ARM (processeurs des Raspberry Pi, Mac M1, etc.)
# ATTENTION : 
# - Il faut créer un fichier .env au même niveau que le docker-compose.yml pour la configuration de l'API
# - Il faut créer un fichier nginx.conf au même niveau que le docker-compose.yml pour la configuration de nginx

networks:
    my-apps-network:
        driver: bridge

services:
    nginx:
        container_name: nginx
        image: nginx:latest
        platform: linux/arm64
        ports:
            - "80:80"
            - "443:443"
        restart: always
        volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf
            - ./certs:/etc/ssl/cloudflare
        networks:
            - my-apps-network

    sv-portfolio:
        container_name: sv-portfolio
        image: sebvillebrun/sv-portfolio:latest
        ports:
            - "8081:8081"
        restart: always
        networks:
            - my-apps-network
        environment:
            - NODE_ENV=production
            - HOST=0.0.0.0
            - PORT=8081
        env_file:
            - .env

    proxy:
        container_name: proxy
        image: sebvillebrun/proxy:latest
        ports:
            - "5000:5000"
        restart: always
        networks:
            - my-apps-network
        env_file:
            - .env

    movie-db-vue:
        container_name: movie-db-vue
        image: sebvillebrun/movie-db-app:latest_vue
        platform: linux/arm64
        ports:
            - "8080:8080"
        restart: always
        networks:
            - my-apps-network
        env_file:
            - .env

    movie-db-core-api:
        container_name: movie-db-core-api
        image: sebvillebrun/movie-db-app:latest_core-api
        platform: linux/arm64
        ports:
            - "3000:3000"
        restart: always
        environment:
            - DATABASE_URL=${DATABASE_URL_MDB}
        networks:
            - my-apps-network
        env_file:
            - .env


    airjewels-db:
        container_name: airjewels-db
        image: postgres:latest
        platform: linux/arm64
        ports:
            - "5432:5432"
        restart: always
        volumes:
            - airjewels-db-data:/var/lib/postgresql
        networks:
            - my-apps-network
        environment:
            - POSTGRES_USER=${POSTGRES_USER_AIRJEWELS}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD_AIRJEWELS}

    airjewels-rails:
        container_name: airjewels-rails
        image: sebvillebrun/airjewels-rails:latest
        platform: linux/arm64
        restart: always
        command: ./bin/rails s -b '0.0.0.0' -p 3001
        ports:
            - "3001:3001"
        depends_on:
            - airjewels-db
        volumes:
            - airjewels-app-storage:/rails/storage
        networks:
            - my-apps-network
        env_file:
            - .env

    academint-db:
        container_name: academint-db
        image: postgres:latest
        platform: linux/arm64
        ports:
            - "5433:5433"
        restart: always
        volumes:
            - academint-db-data:/var/lib/postgresql
        networks:
            - my-apps-network
        environment:
            - POSTGRES_USER=${POSTGRES_USER_ACADEMINT}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD_ACADEMINT}

    academint:
        container_name: academint
        image: sebvillebrun/academint:latest
        platform: linux/arm64
        restart: always
        command: ./bin/rails s -b '0.0.0.0' -p 3002
        ports:
            - "3002:3002"
        depends_on:
            - academint-db
        volumes:
            - academint-app-storage:/rails/storage
        networks:
            - my-apps-network
        env_file:
            - .env

    tv-time-db:
        container_name: tv-time-db
        image: postgres:18
        platform: linux/arm64
        ports:
            - "5434:5432"
        restart: always
        volumes:
            - tv-time-db-data:/var/lib/postgresql
        networks:
            - my-apps-network
        environment:
            - POSTGRES_USER=${POSTGRES_USER_TV_TIME}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD_TV_TIME}
            - POSTGRES_DB=${POSTGRES_DB_TV_TIME}
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 3s
            retries: 20

    # Les migrations Prisma sont appliquées au démarrage du conteneur.
    # Pas d'env_file : JWT_SECRET, GOOGLE_CLIENT_ID et NODE_ENV du .env partagé appartiennent à movie-db-app.
    tv-time-backend:
        container_name: tv-time-backend
        image: sebvillebrun/tv-time-backend:latest
        platform: linux/arm64
        ports:
            - "3003:3001"
        restart: always
        depends_on:
            tv-time-db:
                condition: service_healthy
        networks:
            - my-apps-network
        environment:
            - NODE_ENV=production
            - LOG_LEVEL=info
            - DATABASE_URL=postgresql://${POSTGRES_USER_TV_TIME}:${POSTGRES_PASSWORD_TV_TIME}@tv-time-db:5432/${POSTGRES_DB_TV_TIME}?schema=public
            - JWT_SECRET=${JWT_SECRET_TV_TIME}
            - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID_TV_TIME}
            - TMDB_API_KEY=${TMDB_API_KEY}
            - TV_TIME_FRONT_URL=${TV_TIME_FRONT_URL}

    # Servi par nginx sous /tv-time/. Le runtimeConfig étant figé au build,
    # il est surchargé ici par les variables NUXT_*.
    tv-time-frontend:
        container_name: tv-time-frontend
        image: sebvillebrun/tv-time-frontend:latest
        platform: linux/arm64
        ports:
            - "3004:3000"
        restart: always
        depends_on:
            - tv-time-backend
        networks:
            - my-apps-network
        environment:
            - NUXT_APP_BASE_URL=/tv-time/
            - NUXT_MY_PROXY_URL=http://tv-time-backend:3001/tv-time/api
            - NUXT_PUBLIC_GOOGLE_AUTH_CLIENT_ID=${GOOGLE_CLIENT_ID_TV_TIME}

volumes:
    airjewels-db-data:
        name: airjewels-db-data
    airjewels-app-storage:
        name: airjewels-app-storage
    academint-db-data: 
        name: academint-db-data
    academint-app-storage:
        name: academint-app-storage
    tv-time-db-data:
        name: tv-time-db-data
